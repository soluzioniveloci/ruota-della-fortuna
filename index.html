
           
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruota della Fortuna</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function RouletteGame() {
          const [secretNumber, setSecretNumber] = useState('');
          const [gameStarted, setGameStarted] = useState(false);
          const [numbers, setNumbers] = useState([]);
          const [spinning, setSpinning] = useState(false);
          const [rotation, setRotation] = useState(0);
          const [currentNumber, setCurrentNumber] = useState(null);
          const [eliminatedNumbers, setEliminatedNumbers] = useState([]);
          const [gameOver, setGameOver] = useState(false);
          const [showConfetti, setShowConfetti] = useState(false);
          const canvasRef = useRef(null);
          const confettiRef = useRef(null);

          const drawWheel = () => {
            const canvas = canvasRef.current;
            if (!canvas || numbers.length === 0) return;
            
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 280;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const anglePerSegment = (Math.PI * 2) / numbers.length;
            
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 25, 0, Math.PI * 2);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 12;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 20, 0, Math.PI * 2);
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 10;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 12, 0, Math.PI * 2);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 6;
            ctx.stroke();
            
            ctx.shadowBlur = 0;
            
            numbers.forEach((num, index) => {
              const startAngle = index * anglePerSegment + (rotation * Math.PI / 180);
              const endAngle = startAngle + anglePerSegment;
              
              // Verifica se questo è il numero estratto (quello in alto)
              const isWinning = currentNumber === num;
              
              ctx.beginPath();
              ctx.moveTo(centerX, centerY);
              ctx.arc(centerX, centerY, radius, startAngle, endAngle);
              ctx.closePath();
              
              const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
              
              if (isWinning) {
                // Evidenzia il numero vincente con oro brillante
                gradient.addColorStop(0, '#FFFF00');
                gradient.addColorStop(0.5, '#FFD700');
                gradient.addColorStop(1, '#FFA500');
              } else if (index % 2 === 0) {
                gradient.addColorStop(0, '#FF4444');
                gradient.addColorStop(0.5, '#FF0000');
                gradient.addColorStop(1, '#990000');
              } else {
                gradient.addColorStop(0, '#444444');
                gradient.addColorStop(0.5, '#222222');
                gradient.addColorStop(1, '#000000');
              }
              ctx.fillStyle = gradient;
              ctx.fill();
              
              // Bordo più spesso per il numero vincente
              ctx.strokeStyle = isWinning ? '#FFFFFF' : '#FFD700';
              ctx.lineWidth = isWinning ? 8 : 4;
              ctx.stroke();
              
              // Disegna il numero con effetto 3D
              ctx.save();
              ctx.translate(centerX, centerY);
              ctx.rotate(startAngle + anglePerSegment / 2);
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              
              ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
              ctx.shadowBlur = 6;
              ctx.shadowOffsetX = 3;
              ctx.shadowOffsetY = 3;
              
              // Numero vincente più grande e colorato
              ctx.font = isWinning ? 'bold 36px Arial' : 'bold 26px Arial';
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 5;
              ctx.strokeText(num, radius * 0.7, 0);
              
              ctx.fillStyle = isWinning ? '#8B0000' : '#FFFFFF'; 
              ctx.fillText(num, radius * 0.7, 0);
              ctx.restore();
            });
            
            const centerGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100);
            centerGradient.addColorStop(0, '#FFD700');
            centerGradient.addColorStop(0.5, '#FFA500');
            centerGradient.addColorStop(0.8, '#FF8C00');
            centerGradient.addColorStop(1, '#FF6347');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 100, 0, Math.PI * 2);
            ctx.fillStyle = centerGradient;
            ctx.fill();
            
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 92, 0, Math.PI * 2);
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.save();
            ctx.translate(centerX, centerY);
            for (let i = 0; i < 12; i++) {
              ctx.save();
              ctx.rotate((i * Math.PI) / 6);
              
              const rayGradient = ctx.createLinearGradient(0, 0, 0, -80);
              rayGradient.addColorStop(0, '#8B4513');
              rayGradient.addColorStop(1, '#D2691E');
              
              ctx.strokeStyle = rayGradient;
              ctx.lineWidth = 6;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(0, -80);
              ctx.stroke();
              
              ctx.beginPath();
              ctx.arc(0, -75, 5, 0, Math.PI * 2);
              ctx.fillStyle = '#FFD700';
              ctx.fill();
              ctx.restore();
            }
            ctx.restore();
            
            const innerGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 25);
            innerGradient.addColorStop(0, '#FFD700');
            innerGradient.addColorStop(1, '#B8860B');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            ctx.fillStyle = innerGradient;
            ctx.fill();
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            for (let i = 0; i < 16; i++) {
              const angle = (i / 16) * Math.PI * 2;
              const x = centerX + Math.cos(angle) * (radius + 18);
              const y = centerY + Math.sin(angle) * (radius + 18);
              
              const gemGradient = ctx.createRadialGradient(x, y, 0, x, y, 8);
              gemGradient.addColorStop(0, '#FFFF00');
              gemGradient.addColorStop(0.5, '#FFD700');
              gemGradient.addColorStop(1, '#FFA500');
              
              ctx.beginPath();
              ctx.arc(x, y, 8, 0, Math.PI * 2);
              ctx.fillStyle = gemGradient;
              ctx.fill();
              ctx.strokeStyle = '#8B4513';
              ctx.lineWidth = 2;
              ctx.stroke();
            }

            // Disegna la freccia fissa in alto
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Freccia fissa posizionata in alto (0 gradi)
            const arrowDistance = radius + 45;
            
            ctx.beginPath();
            // Punta del triangolo (più lontana dal centro)
            ctx.moveTo(arrowDistance + 30, 0);
            // Bordo superiore (più vicino al centro)
            ctx.lineTo(arrowDistance, -25);
            // Bordo inferiore (più vicino al centro)
            ctx.lineTo(arrowDistance, 25);
            ctx.closePath();
            
            // Effetto brillante per la freccia
            const arrowGradient = ctx.createLinearGradient(arrowDistance, 0, arrowDistance + 30, 0);
            arrowGradient.addColorStop(0, '#FF0000');
            arrowGradient.addColorStop(0.5, '#FF3333');
            arrowGradient.addColorStop(1, '#FFFFFF');
            
            ctx.fillStyle = arrowGradient;
            ctx.fill();
            ctx.strokeStyle = '#8B0000';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // Cerchio alla base della freccia
            ctx.beginPath();
            ctx.arc(arrowDistance + 15, 0, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#FF0000';
            ctx.fill();
            ctx.strokeStyle = '#8B0000';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.restore();
          };

          const drawConfetti = () => {
            const canvas = confettiRef.current;
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const confettiPieces = [];
            const colors = ['#FFD700', '#FF0000', '#00FF00', '#0000FF', '#FF00FF', '#FFA500', '#00FFFF'];
            
            for (let i = 0; i < 150; i++) {
              confettiPieces.push({
                x: Math.random() * canvas.width,
                y: -20,
                w: Math.random() * 10 + 5,
                h: Math.random() * 15 + 5,
                vx: (Math.random() - 0.5) * 4,
                vy: Math.random() * 3 + 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.2
              });
            }
            
            let frame = 0;
            const animate = () => {
              if (frame > 180) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setShowConfetti(false);
                return;
              }
              
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              
              confettiPieces.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
                
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotationSpeed;
                p.vy += 0.1;
              });
              
              frame++;
              requestAnimationFrame(animate);
            };
            
            animate();
          };

          useEffect(() => {
            drawWheel();
          }, [numbers, rotation, currentNumber]);

          useEffect(() => {
            if (showConfetti) {
              drawConfetti();
            }
          }, [showConfetti]);

          const startGame = () => {
            if (!secretNumber || secretNumber < 1 || secretNumber > 50) {
              alert('Inserisci un numero tra 1 e 50');
              return;
            }
            const nums = Array.from({ length: 50 }, (_, i) => i + 1);
            setNumbers(nums);
            setGameStarted(true);
          };

          const spinWheel = () => {
            if (spinning || numbers.length === 0) return;
            
            setSpinning(true);
            
            let targetNum;
            if (numbers.length === 1) {
              targetNum = numbers[0];
              setGameOver(true);
            } else {
              const availableNumbers = numbers.filter(n => n !== parseInt(secretNumber));
              targetNum = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
            }
            
            const targetIndex = numbers.indexOf(targetNum);
            const anglePerSegment = 360 / numbers.length;
            
            // Calcolo per far fermare il numero estratto esattamente sotto la freccia (a 0 gradi)
            // La freccia è fissa a 0 gradi (in alto)
            const targetAngle = 360 * 5 - (targetIndex * anglePerSegment) - (anglePerSegment / 2);
            
            let start = null;
            const duration = 3000;
            
            const animate = (timestamp) => {
              if (!start) start = timestamp;
              const progress = (timestamp - start) / duration;
              
              if (progress < 1) {
                const easeOut = 1 - Math.pow(1 - progress, 4);
                setRotation(targetAngle * easeOut);
                requestAnimationFrame(animate);
              } else {
                setRotation(targetAngle);
                setCurrentNumber(targetNum);
                setSpinning(false);
                setShowConfetti(true);
                
                setTimeout(() => {
                  const newNumbers = numbers.filter(n => n !== targetNum);
                  setNumbers(newNumbers);
                  setEliminatedNumbers([...eliminatedNumbers, targetNum]);
                  setCurrentNumber(null);
                  setRotation(0);
                }, 2000);
              }
            };
            
            requestAnimationFrame(animate);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-gray-900 via-amber-900 to-black flex flex-col items-center justify-center p-4 relative overflow-hidden">
              <div className="absolute inset-0 opacity-20">
                <div className="absolute top-0 left-1/4 w-96 h-96 bg-yellow-500 rounded-full blur-3xl animate-pulse"></div>
                <div className="absolute bottom-0 right-1/4 w-96 h-96 bg-red-600 rounded-full blur-3xl animate-pulse delay-1000"></div>
              </div>
              
              <canvas
                ref={confettiRef}
                width={window.innerWidth}
                height={window.innerHeight}
                className="absolute inset-0 pointer-events-none z-50"
              />
              
              <div className="relative z-10 w-full max-w-7xl">
                <div className="text-center mb-6">
                  <h1 className="text-7xl font-bold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 drop-shadow-2xl animate-pulse">
                    🎰 RUOTA DELLA FORTUNA 🎰
                  </h1>
                  <div className="flex justify-center gap-3 mt-6">
                    <div className="w-4 h-4 bg-yellow-400 rounded-full animate-bounce"></div>
                    <div className="w-4 h-4 bg-red-600 rounded-full animate-bounce delay-100"></div>
                    <div className="w-4 h-4 bg-yellow-400 rounded-full animate-bounce delay-200"></div>
                  </div>
                </div>
                
                {!gameStarted ? (
                  <div className="max-w-xl mx-auto bg-gradient-to-br from-amber-900/90 to-red-900/90 backdrop-blur-xl p-12 rounded-3xl border-4 border-yellow-400 shadow-2xl">
                    <h2 className="text-4xl text-yellow-300 mb-6 font-bold text-center drop-shadow-lg">🎯 Inserisci il Numero Vincente</h2>
                    <p className="text-gray-100 mb-8 text-center text-xl">Questo numero uscirà per ultimo!</p>
                    <input
                      type="number"
                      min="1"
                      max="50"
                      value={secretNumber}
                      onChange={(e) => setSecretNumber(e.target.value)}
                      className="w-full px-8 py-6 text-4xl text-center bg-black/80 text-yellow-300 border-4 border-yellow-400 rounded-2xl mb-8 font-bold focus:ring-4 focus:ring-yellow-300 focus:outline-none shadow-2xl"
                      placeholder="1-50"
                    />
                    <button
                      onClick={startGame}
                      className="w-full bg-gradient-to-r from-yellow-400 via-amber-500 to-red-600 text-white px-10 py-6 rounded-2xl font-bold text-3xl hover:from-yellow-500 hover:to-red-700 transition-all shadow-2xl hover:scale-105 hover:shadow-yellow-400/50 border-2 border-yellow-300"
                    >
                      🎮 INIZIA IL GIOCO
                    </button>
                  </div>
                ) : (
                  <div className="flex flex-col items-center">
                    <div className="relative mb-6 p-10 bg-gradient-to-br from-amber-950/60 to-red-950/60 rounded-3xl shadow-2xl border-4 border-yellow-500 backdrop-blur-sm">
                      <canvas
                        ref={canvasRef}
                        width={700}
                        height={700}
                        className="drop-shadow-2xl"
                      />
                    </div>
                    
                    {currentNumber && (
                      <div className="bg-gradient-to-r from-yellow-400 via-amber-500 to-red-600 px-16 py-8 rounded-3xl mb-8 animate-bounce shadow-2xl border-4 border-yellow-200">
                        <p className="text-6xl font-bold text-white drop-shadow-2xl">🎉 Numero: {currentNumber} 🎉</p>
                      </div>
                    )}
                    
                    {!gameOver && (
                      <button
                        onClick={spinWheel}
                        disabled={spinning}
                        className={`bg-gradient-to-r from-yellow-400 via-amber-500 to-red-600 text-white px-20 py-8 rounded-3xl font-bold text-4xl transition-all shadow-2xl border-4 border-yellow-200 ${
                          spinning ? 'opacity-50 cursor-not-allowed' : 'hover:from-yellow-500 hover:to-red-700 hover:scale-110 hover:shadow-yellow-400/60 animate-pulse'
                        }`}
                      >
                        {spinning ? '🎡 GIRANDO...' : '🎰 GIRA LA RUOTA'}
                      </button>
                    )}
                    
                    {gameOver && (
                      <div className="bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 p-12 rounded-3xl border-4 border-yellow-200 shadow-2xl animate-pulse">
                        <h2 className="text-6xl font-bold text-white mb-6 drop-shadow-2xl">🏆 GIOCO TERMINATO! 🏆</h2>
                        <p className="text-4xl text-white drop-shadow-xl">Il numero vincente era: <span className="text-7xl font-bold">{numbers[0]}</span></p>
                      </div>
                    )}
                    
                    <div className="mt-10 bg-gradient-to-br from-black/80 to-amber-950/80 backdrop-blur-md p-10 rounded-3xl border-4 border-yellow-500 shadow-2xl max-w-4xl">
                      <h3 className="text-3xl text-yellow-300 mb-5 font-bold">📊 Numeri Rimasti: {numbers.length}</h3>
                      <h3 className="text-3xl text-red-400 mb-6 font-bold">❌ Numeri Eliminati: {eliminatedNumbers.length}</h3>
                      <div className="flex flex-wrap gap-4 justify-center">
                        {eliminatedNumbers.map(num => (
                          <span key={num} className="bg-gradient-to-br from-red-600 to-red-900 text-white px-5 py-3 rounded-full text-xl font-bold shadow-xl border-2 border-red-400 hover:scale-110 transition-transform">
                            {num}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        ReactDOM.render(<RouletteGame />, document.getElementById('root'));
    </script>
</body>
</html>
